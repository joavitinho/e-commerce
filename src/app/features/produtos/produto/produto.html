
<mat-card class="produto">

<mat-card-header>
<mat-card-title> {{ nome |uppercase }} </mat-card-title>
   </mat-card-header>

   <mat-card-content>
     <p> {{ preco | precoFormatado}}</p>
   </mat-card-content>

<mat-card-actions>
      <button mat-stroked-button color="accent" (click)="selecionarProduto()">
         Comprar Agora
      </button>

  <button mat-stroked-button color="primary" (click)="adicionarAoCarrinho()">
      Selecionar {{ nome }}
  </button>

</mat-card-actions>

</mat-card>
